var TY={mc:"Pilihan Ganda",tb:"Tabel Benar/Salah",cb:"Checklist: pilih semua yang benar"};
var Q=[
{e:1,s:"Profesi dan Kewirausahaan PPLG",t:"mc",q:"Seorang profesional bertugas merancang mekanik, level, dan alur pengalaman pemain dalam sebuah gim. Profesi tersebut adalah…",o:["Game Designer","Network Administrator","Database Administrator","Quality Assurance Tester"],a:0,x:["Tepat. Game designer merancang mekanik, level, dan alur pengalaman pemain.","Network administrator mengelola infrastruktur jaringan, bukan desain gim.","Database administrator mengelola dan menjaga basis data.","QA tester menguji kualitas produk dan melaporkan bug, bukan merancang gim."]},
{e:1,s:"Manajemen Proyek dan Budaya Mutu",t:"cb",q:"Pilih SEMUA yang merupakan tahapan dasar manajemen proyek perangkat lunak:",o:["Perencanaan (planning)","Pelaksanaan/pengembangan","Pemantauan dan pengendalian","Mengabaikan umpan balik klien","Penutupan dan evaluasi proyek"],a:[0,1,2,4],x:["Benar. Perencanaan menentukan ruang lingkup, jadwal, dan sumber daya.","Benar. Pelaksanaan adalah tahap membangun produk sesuai rencana.","Benar. Pemantauan memastikan proyek sesuai jadwal dan mutu.","Salah. Budaya mutu justru menuntut umpan balik klien ditindaklanjuti.","Benar. Penutupan mencakup serah terima dan evaluasi pembelajaran."]},
{e:2,s:"K3LH dan Budaya Kerja Profesional",t:"mc",q:"Kamu melihat kabel listrik terkelupas di meja kerja lab komputer. Tindakan paling tepat adalah…",o:["Membiarkannya karena komputer masih menyala","Menjauhi area tersebut dan melaporkan ke penanggung jawab lab","Membungkusnya dengan kertas","Mencabutnya langsung dengan tangan basah"],a:1,x:["Berbahaya. Kabel terkelupas berisiko sengatan listrik dan korsleting meski perangkat masih berfungsi.","Tepat. Prinsip K3: hindari bahaya dan laporkan agar ditangani orang yang berwenang.","Kertas bukan isolator yang aman dan mudah terbakar.","Sangat berbahaya. Air menghantarkan listrik sehingga risiko tersengat meningkat."]},
{e:2,s:"Pengelolaan Aset Fisik dan Digital",t:"tb",q:"Tentukan Benar atau Salah untuk pengelolaan aset proyek berikut:",c:["Benar","Salah"],r:[["Source code disimpan di repositori terpusat dengan version control.",0,"Benar. Version control menjaga riwayat perubahan dan memudahkan kolaborasi."],["Password database ditulis di README yang bersifat publik.",1,"Salah. Kredensial harus disimpan aman, misalnya di file konfigurasi terpisah yang tidak dipublikasikan."],["File proyek dicadangkan (backup) secara rutin ke lokasi terpisah.",0,"Benar. Backup melindungi aset digital dari kehilangan atau kerusakan perangkat."],["Penamaan file dibiarkan bebas, misalnya “final2_baru(1).zip”.",1,"Salah. Penamaan dan struktur direktori yang konsisten memudahkan pengelolaan aset."]]},
{e:3,s:"Lingkungan Sistem Operasi",t:"mc",q:"Pada terminal Linux, perintah untuk membuat direktori proyek baru bernama “gim2d” adalah…",o:["mkdir gim2d","rm gim2d","cd gim2d","ls gim2d"],a:0,x:["Tepat. mkdir (make directory) membuat direktori baru.","rm menghapus file atau direktori, bukan membuat.","cd berpindah ke direktori yang sudah ada.","ls menampilkan isi direktori."]},
{e:3,s:"Infrastruktur dan Perangkat Jaringan",t:"tb",q:"Tentukan Benar atau Salah terkait konfigurasi dan konektivitas jaringan:",c:["Benar","Salah"],r:[["IP 192.168.1.10 dan 192.168.1.20 dengan subnet mask 255.255.255.0 berada dalam satu jaringan.",0,"Benar. Tiga oktet pertama (192.168.1) sama sehingga satu network."],["Perintah ping digunakan untuk menguji konektivitas ke host lain.",0,"Benar. Ping mengirim paket ICMP dan mengukur balasannya."],["Fungsi utama switch adalah menghubungkan dua jaringan berbeda dan menentukan rute antarjaringan.",1,"Salah. Itu fungsi router. Switch menghubungkan perangkat dalam satu jaringan lokal."],["Dua perangkat dalam satu jaringan boleh memakai IP address yang sama.",1,"Salah. IP yang sama menyebabkan konflik alamat."]]},
{e:3,s:"Arsitektur dan Mekanisme TCP/IP",t:"cb",q:"Pilih SEMUA protokol yang bekerja pada layer Application model TCP/IP:",o:["HTTP","DNS","TCP","IP","FTP"],a:[0,1,4],x:["Benar. HTTP dipakai untuk komunikasi web di layer Application.","Benar. DNS menerjemahkan nama domain menjadi alamat IP di layer Application.","Salah. TCP berada di layer Transport.","Salah. IP berada di layer Internet.","Benar. FTP untuk transfer file, berada di layer Application."]},
{e:4,s:"Struktur Data dan Tipe Data",t:"mc",q:"Sebuah gim menyimpan banyak item inventaris pemain dengan urutan tetap dan diakses melalui nomor urut. Struktur data yang paling sesuai adalah…",o:["Array/list","Variabel boolean","Variabel integer tunggal","Konstanta string"],a:0,x:["Tepat. Array menyimpan banyak elemen berurutan yang diakses lewat indeks.","Boolean hanya menyimpan satu nilai benar/salah.","Integer tunggal hanya menyimpan satu bilangan, tidak cukup untuk banyak item.","Konstanta string menyimpan satu teks yang tidak berubah."]},
{e:4,s:"Struktur Kontrol Program",t:"tb",code:"total = 0\nfor i = 1 to 4:\n    if i mod 2 == 0:\n        total = total + i",q:"Perhatikan potongan program berikut. Tentukan Benar atau Salah:",c:["Benar","Salah"],r:[["Nilai akhir total adalah 6.",0,"Benar. Hanya i = 2 dan 4 yang genap, sehingga 2 + 4 = 6."],["Perulangan berjalan sebanyak 4 kali.",0,"Benar. i bernilai 1, 2, 3, 4."],["Kondisi if bernilai benar untuk i = 1 dan i = 3.",1,"Salah. Kondisi i mod 2 == 0 benar untuk bilangan genap (2 dan 4)."],["Jika kondisi diganti i mod 2 == 1, nilai akhir total menjadi 4.",0,"Benar. Bilangan ganjil 1 + 3 = 4."]]},
{e:4,s:"Modularisasi Program",t:"mc",q:"Fungsi hitungDamage() dipanggil berulang di banyak bagian gim. Keuntungan utama modularisasi tersebut adalah…",o:["Kode dapat digunakan ulang dan lebih mudah dirawat","Program berjalan tanpa memakai memori","Algoritma tidak lagi diperlukan","Jumlah baris kode pasti bertambah"],a:0,x:["Tepat. Logika ditulis sekali, dipanggil berkali-kali, dan perubahan cukup dilakukan di satu tempat.","Salah. Program tetap memakai memori.","Salah. Fungsi justru berisi algoritma.","Salah. Modularisasi umumnya mengurangi duplikasi kode."]},
{e:5,s:"Konsep Dasar dan Prinsip OOP",t:"cb",q:"Pilih SEMUA yang merupakan prinsip dasar OOP:",o:["Enkapsulasi","Pewarisan (inheritance)","Polimorfisme","Perulangan (looping)","Abstraksi"],a:[0,1,2,4],x:["Benar. Enkapsulasi membungkus data dan method dalam satu class.","Benar. Pewarisan memungkinkan subclass memakai atribut dan method superclass.","Benar. Polimorfisme: satu antarmuka, banyak perilaku.","Salah. Looping adalah struktur kontrol, bukan prinsip OOP.","Benar. Abstraksi menyembunyikan detail dan menampilkan hal penting."]},
{e:5,s:"Enkapsulasi dan Access Modifier",t:"mc",q:"Atribut saldo pada class Pemain tidak boleh diubah langsung dari luar class, hanya lewat setter yang memvalidasi nilai. Access modifier yang tepat untuk atribut saldo adalah…",o:["public","private","protected","static"],a:1,x:["Salah. public membuat atribut bisa diubah bebas dari mana saja.","Tepat. private membatasi akses hanya di dalam class, sehingga perubahan wajib melalui setter.","Kurang tepat. protected masih bisa diakses subclass dan package yang sama.","Salah. static berarti milik class, bukan pengatur hak akses."]},
{e:5,s:"Pewarisan",t:"mc",q:"Class Zombie harus mewarisi class Musuh. Penulisan yang benar dalam Java adalah…",o:["class Zombie extends Musuh","class Zombie implements Musuh","class Musuh extends Zombie","class Zombie new Musuh"],a:0,x:["Tepat. extends dipakai untuk pewarisan class, Musuh sebagai superclass.","implements dipakai untuk interface, bukan class biasa.","Arah pewarisan terbalik: Musuh akan menjadi subclass dari Zombie.","Bukan sintaks pewarisan yang valid."]},
{e:5,s:"Polymorphism",t:"cb",code:"Hewan h = new Kucing();\nh.suara();  // Kucing meng-override suara()",q:"Perhatikan potongan program berikut. Pilih SEMUA pernyataan yang benar:",o:["Referensi superclass dapat menunjuk objek subclass","Yang dijalankan adalah method suara() milik Kucing","Peristiwa ini disebut method overloading","Overriding memakai nama dan parameter yang sama dengan method superclass"],a:[0,1,3],x:["Benar. Hewan h = new Kucing() sah karena Kucing adalah Hewan.","Benar. Method yang dijalankan mengikuti objek aslinya (Kucing).","Salah. Overloading berarti nama sama tetapi parameter berbeda dalam satu class; ini overriding.","Benar. Overriding mendefinisikan ulang method superclass dengan signature yang sama."]},
{e:1,s:"Profesi dan Kewirausahaan PPLG",t:"mc",q:"Tiga siswa SMK membuat gim edukasi sederhana dan ingin menjadikannya usaha. Langkah awal paling tepat menurut prinsip technopreneurship adalah…",o:["Mengembangkan versi lengkap dengan semua fitur selama setahun sebelum diperlihatkan ke pengguna","Membuat prototipe minimal (MVP), mengujinya ke calon pengguna, lalu memperbaikinya berdasarkan umpan balik","Menunggu gim benar-benar sempurna supaya tidak ada kritik","Meniru gim populer persis agar pasti laku"],a:1,x:["Kurang tepat. Mengembangkan semua fitur tanpa validasi berisiko membuang waktu dan biaya bila ternyata tidak sesuai kebutuhan pasar. Technopreneurship menekankan validasi sejak dini.","Tepat. MVP memungkinkan ide diuji cepat dengan biaya kecil. Umpan balik pengguna lalu menentukan fitur mana yang layak dikembangkan, sehingga risiko usaha ditekan.","Kurang tepat. Produk yang menunggu sempurna cenderung terlambat rilis dan tidak pernah teruji pasar. Kritik justru bahan perbaikan mutu.","Kurang tepat. Meniru persis menghilangkan nilai inovasi dan berpotensi melanggar hak cipta. Peluang usaha muncul dari solusi yang punya pembeda."],w:"Technopreneurship memadukan teknologi dan kewirausahaan dengan siklus: identifikasi masalah, buat MVP, uji ke pengguna, lalu iterasi. Siklus ini sejalan dengan budaya mutu karena perbaikan dilakukan terus-menerus berdasarkan data pengguna."},
{e:2,s:"K3LH dan Budaya Kerja Profesional",t:"cb",q:"Seorang programmer bekerja 8 jam sehari di depan komputer. Pilih SEMUA tindakan yang sesuai prinsip K3 dan ergonomi:",o:["Menempatkan monitor sejajar pandangan mata dan punggung bersandar pada kursi","Beristirahat singkat secara berkala dan melakukan peregangan","Mematikan lampu ruangan agar layar terlihat lebih fokus","Menata kabel agar tidak melintang di jalur jalan","Memasang banyak perangkat berdaya besar pada satu stopkontak bercabang"],a:[0,1,3],x:["Benar. Posisi monitor sejajar mata dan sandaran punggung mengurangi beban leher dan tulang belakang, dua keluhan umum pekerja komputer.","Benar. Istirahat berkala dan peregangan mencegah kelelahan mata (computer vision syndrome) dan gangguan otot akibat posisi statis.","Salah. Kontras ekstrem antara layar terang dan ruangan gelap membuat mata cepat lelah. Pencahayaan ruangan yang memadai tetap diperlukan.","Benar. Kabel yang melintang berisiko membuat orang tersandung dan menarik perangkat jatuh. Penataan kabel adalah bagian dari lingkungan kerja yang aman.","Salah. Beban berlebih pada satu stopkontak menyebabkan panas dan risiko korsleting atau kebakaran. Daya total harus sesuai kapasitas."],w:"K3LH mencakup keselamatan (risiko listrik dan tersandung), kesehatan (ergonomi, kelelahan mata), dan lingkungan kerja yang tertib. Budaya kerja profesional berarti menerapkan kebiasaan ini secara konsisten, bukan hanya saat diawasi."},
{e:3,s:"Lingkungan Sistem Operasi",t:"cb",q:"Kamu menyiapkan lingkungan pengembangan di komputer baru. Pilih SEMUA tindakan yang tepat:",o:["Menyusun direktori proyek terstruktur, misalnya src, assets, dan docs","Menambahkan lokasi compiler/interpreter ke variabel lingkungan PATH agar dikenali dari terminal","Menjalankan seluruh pekerjaan sebagai administrator/root agar tidak ada error izin","Memeriksa instalasi dengan perintah versi, misalnya java -version","Menyimpan semua file proyek langsung di Desktop tanpa struktur"],a:[0,1,3],x:["Benar. Struktur direktori yang konsisten memisahkan kode, aset, dan dokumentasi sehingga proyek mudah dirawat dan dibagikan.","Benar. Tanpa PATH, perintah seperti javac atau python tidak ditemukan dari terminal meski aplikasinya sudah terpasang.","Salah. Bekerja sebagai root melanggar prinsip hak akses minimum: kesalahan kecil dapat merusak sistem. Perbaiki izin file yang bermasalah, bukan menghapus pembatasan.","Benar. Perintah versi memastikan instalasi berhasil dan versi yang terpasang sesuai kebutuhan proyek.","Salah. File tanpa struktur menyulitkan pencarian, backup, dan kolaborasi, sehingga bertentangan dengan pengelolaan file proyek yang baik."],w:"Konfigurasi dasar lingkungan pengembangan meliputi instalasi tools, pengaturan PATH, verifikasi versi, dan penataan direktori. Prinsipnya: bekerja dengan hak akses secukupnya dan struktur yang terorganisasi."},
{e:3,s:"Infrastruktur dan Perangkat Jaringan",t:"mc",q:"Dari komputer lab, ping 8.8.8.8 berhasil, tetapi ping google.com gagal dengan pesan unknown host. Penyebab yang paling mungkin adalah…",o:["Kabel jaringan komputer putus","Konfigurasi DNS server salah atau tidak dapat dijangkau","Subnet mask terlalu kecil","Default gateway belum diatur"],a:1,x:["Kurang tepat. Jika kabel putus, ping ke 8.8.8.8 juga akan gagal. Fakta bahwa ping ke alamat IP berhasil membuktikan koneksi fisik berfungsi.","Tepat. Ping ke IP berhasil berarti konektivitas dan routing ke internet normal. Kegagalan hanya pada nama domain menunjukkan proses penerjemahan nama menjadi IP (DNS) bermasalah.","Kurang tepat. Subnet mask yang keliru umumnya mengganggu komunikasi lintas jaringan secara umum, sehingga ping ke 8.8.8.8 juga ikut gagal.","Kurang tepat. Tanpa default gateway, paket ke jaringan lain (termasuk 8.8.8.8) tidak dapat diteruskan, padahal ping tersebut berhasil."],w:"Teknik troubleshooting: uji berlapis dari bawah ke atas. Ping ke IP menguji konektivitas jaringan, sedangkan ping ke nama domain menambahkan ketergantungan pada DNS. Perbedaan hasil keduanya mempersempit sumber masalah."},
{e:3,s:"Arsitektur dan Mekanisme TCP/IP",t:"mc",q:"Saat browser mengirim permintaan halaman web, urutan layer yang dilalui data dari sisi pengirim pada model TCP/IP adalah…",o:["Application (HTTP), Transport (TCP), Internet (IP), Network Access","Network Access, Internet, Transport, Application","Application, Internet, Transport, Network Access","Transport, Application, Network Access, Internet"],a:0,x:["Tepat. Data dari aplikasi dibungkus segmen TCP di layer Transport, lalu paket IP di layer Internet, lalu frame di Network Access sebelum dikirim lewat media fisik (enkapsulasi).","Kurang tepat. Urutan ini adalah arah penerimaan (decapsulation) di sisi penerima, bukan pengiriman.","Kurang tepat. Layer Transport harus berada sebelum Internet karena segmen TCP perlu dibentuk sebelum diberi alamat IP.","Kurang tepat. Data berasal dari aplikasi, jadi Application selalu menjadi titik awal di sisi pengirim."],w:"Pengiriman data memakai enkapsulasi dari atas ke bawah: tiap layer menambahkan header sendiri. TCP menangani keandalan dan nomor port, IP menangani pengalamatan dan routing, Network Access menangani pengiriman pada media fisik."},
{e:4,s:"Struktur Kontrol Program",t:"mc",code:"n = 1\nwhile n != 20:\n    n = n * 2\nprint(n)",q:"Apa yang terjadi saat potongan program berikut dijalankan?",o:["Mencetak 20 lalu selesai","Mencetak 16 lalu selesai","Perulangan tidak pernah berhenti karena n melompati nilai 20","Perulangan tidak dijalankan sama sekali"],a:2,x:["Kurang tepat. n tidak pernah bernilai 20 karena hanya berubah menjadi 1, 2, 4, 8, 16, 32, dan seterusnya.","Kurang tepat. Saat n = 16, kondisi n != 20 masih benar sehingga perulangan lanjut ke 32. Program tidak berhenti di 16.","Tepat. Nilai n selalu hasil kelipatan dua dan melompati 20, jadi kondisi n != 20 selalu benar (infinite loop). Kondisi yang lebih aman adalah n kurang dari 20.","Kurang tepat. Awalnya n = 1 sehingga kondisi n != 20 benar dan badan perulangan langsung dijalankan."],w:"Menganalisis perulangan berarti menelusuri nilai variabel tiap iterasi. Kondisi kesamaan atau ketidaksamaan rawan menyebabkan infinite loop bila nilai tidak tepat menyentuh batas, sehingga kondisi berbasis perbandingan lebih efektif."},
{e:4,s:"Modularisasi Program",t:"tb",code:"function luas(p, l):\n    hasil = p * l\n    return hasil\n\nx = luas(4, 5)\nprint(hasil)",q:"Perhatikan program berikut. Tentukan Benar atau Salah:",c:["Benar","Salah"],r:[["Variabel x bernilai 20.",0,"Benar. Fungsi menghitung 4 x 5 = 20 dan mengembalikannya lewat return, lalu nilainya disimpan ke x."],["print(hasil) menampilkan 20.",1,"Salah. hasil adalah variabel lokal di dalam fungsi luas dan tidak dikenal di luar fungsi (masalah scope). Yang seharusnya dicetak adalah x."],["p dan l adalah parameter dari fungsi luas.",0,"Benar. Parameter adalah variabel penerima nilai pada definisi fungsi, sedangkan 4 dan 5 adalah argumen."],["luas disebut prosedur karena mengembalikan nilai.",1,"Salah. Subprogram yang mengembalikan nilai disebut fungsi. Prosedur menjalankan aksi tanpa mengembalikan nilai."]],w:"Desain modular yang baik memisahkan perhitungan (fungsi dengan return) dari tampilan. Memahami scope, parameter vs argumen, dan beda fungsi vs prosedur membantu menghindari bug yang terlihat sepele."},
{e:5,s:"Enkapsulasi dan Access Modifier",t:"cb",code:"class Rekening {\n  private double saldo;\n  public double getSaldo() { return saldo; }\n  public void setor(double jumlah) {\n    if (jumlah > 0) saldo += jumlah;\n  }\n}",q:"Perhatikan class berikut. Pilih SEMUA pernyataan yang benar:",o:["Objek dari luar class dapat membaca saldo melalui getSaldo()","Objek dari luar class dapat menulis rek.saldo = 500 secara langsung","Method setor() melindungi saldo dari nilai setoran yang tidak valid","Karena tidak ada setter untuk saldo, nilainya hanya dapat berubah lewat setor()"],a:[0,2,3],x:["Benar. getSaldo() adalah accessor (getter) yang bersifat public sehingga membaca nilai tetap diizinkan walau atributnya private.","Salah. Atribut private tidak dapat diakses langsung dari luar class, jadi rek.saldo = 500 menyebabkan error kompilasi.","Benar. Kondisi jumlah > 0 menolak setoran nol atau negatif, sehingga data tetap valid. Inilah manfaat validasi di dalam method.","Benar. Perubahan saldo dikendalikan satu pintu lewat setor() sehingga aturan bisnis tidak bisa dilewati. Ini inti enkapsulasi."],w:"Enkapsulasi = atribut private + akses terkontrol lewat method public. Hasilnya integritas data terjaga karena setiap perubahan melewati validasi."},
{e:5,s:"Pewarisan",t:"tb",code:"class Kendaraan { protected int roda; }\nclass Motor extends Kendaraan {\n  Motor() { roda = 2; }\n}",q:"Perhatikan relasi class berikut. Tentukan Benar atau Salah:",c:["Benar","Salah"],r:[["Motor mewarisi atribut roda dari Kendaraan.",0,"Benar. Kata kunci extends membuat Motor (subclass) memperoleh atribut dan method non-private dari Kendaraan (superclass)."],["Motor dapat mengakses roda karena atribut tersebut berstatus protected.",0,"Benar. protected mengizinkan akses dari subclass, berbeda dengan private yang hanya terbuka di class itu sendiri."],["Kendaraan adalah subclass dari Motor.",1,"Salah. Arahnya terbalik. Kendaraan adalah superclass yang lebih umum, Motor adalah subclass yang lebih khusus (Motor adalah sebuah Kendaraan)."],["Java mengizinkan Motor mewarisi dua class sekaligus dengan extends.",1,"Salah. Java hanya mendukung pewarisan tunggal untuk class. Perilaku jamak dicapai melalui interface."]],w:"Uji relasi pewarisan dengan kalimat ‘adalah sebuah’: Motor adalah sebuah Kendaraan (valid). Hak akses protected memungkinkan subclass memakai atribut induk tanpa membukanya ke seluruh program."},
{e:5,s:"Polymorphism",t:"mc",code:"class Musuh { void serang() { cetak(Musuh menyerang) } }\nclass Naga extends Musuh {\n  void serang() { cetak(Naga menyemburkan api) }\n}\nMusuh m = new Naga();\nm.serang();",q:"Keluaran program dan alasan yang paling tepat adalah…",o:["Musuh menyerang, karena tipe referensi m adalah Musuh","Naga menyemburkan api, karena method yang dijalankan ditentukan oleh objek sebenarnya saat program berjalan","Error kompilasi, karena objek Naga tidak boleh disimpan di variabel Musuh","Musuh menyerang lalu Naga menyemburkan api, karena kedua method dipanggil"],a:1,x:["Kurang tepat. Tipe referensi menentukan method apa yang boleh dipanggil, tetapi versi yang dieksekusi ditentukan oleh objek yang sebenarnya dibuat (Naga).","Tepat. Ini polimorfisme lewat overriding (dynamic binding): referensi superclass menunjuk objek subclass, dan versi serang() milik Naga yang dijalankan.","Kurang tepat. Naga adalah sebuah Musuh sehingga penyimpanan ke variabel Musuh sah (upcasting).","Kurang tepat. Hanya satu method yang dieksekusi. Method superclass tidak otomatis ikut dipanggil kecuali dipanggil eksplisit dengan super.serang()."],w:"Overriding memungkinkan subclass mengganti perilaku superclass. Dengan referensi superclass, kode yang sama dapat memproses berbagai jenis objek dan perilakunya menyesuaikan, sehingga program mudah diperluas."},
{e:1,s:"Profesi dan Kewirausahaan PPLG",t:"mc",q:"Tugas utama seorang Software Engineer dalam tim pengembangan aplikasi adalah…",o:["Merancang, menulis, menguji, dan memelihara perangkat lunak","Memasang kabel dan mengonfigurasi switch jaringan","Menggambar ilustrasi karakter dan animasi gim","Melayani pembelian dan keluhan pelanggan di toko"],a:0,x:["Tepat. Software engineer menangani siklus pengembangan perangkat lunak: desain, kode, uji, dan pemeliharaan.","Itu pekerjaan teknisi atau administrator jaringan, bukan pengembang perangkat lunak.","Itu tugas seniman gim (game artist), bukan peran utama software engineer.","Itu tugas layanan pelanggan atau penjualan, bukan pengembangan perangkat lunak."]},
{e:1,s:"Profesi dan Kewirausahaan PPLG",t:"cb",q:"Pilih SEMUA profesi yang termasuk bidang PPLG:",o:["Game Developer","Web Developer","QA Tester","Teknisi AC","Software Architect"],a:[0,1,2,4],x:["Benar. Game developer membangun logika dan sistem gim.","Benar. Web developer membangun aplikasi berbasis web.","Benar. QA tester menjamin mutu perangkat lunak melalui pengujian.","Salah. Teknisi AC bekerja di bidang pendingin udara, bukan perangkat lunak.","Benar. Software architect merancang struktur dan teknologi sistem secara keseluruhan."]},
{e:1,s:"Profesi dan Kewirausahaan PPLG",t:"tb",q:"Tentukan Benar atau Salah terkait peluang usaha di bidang perangkat lunak dan gim:",c:["Benar","Salah"],r:[["Jasa pembuatan aplikasi atau website termasuk peluang usaha PPLG.",0,"Benar. Banyak bisnis membutuhkan aplikasi dan website sehingga jasa pengembangan menjadi peluang nyata."],["Technopreneurship hanya berarti menjual perangkat komputer.",1,"Salah. Technopreneurship adalah kewirausahaan berbasis teknologi, termasuk produk dan layanan perangkat lunak."],["Gim dapat dimonetisasi lewat iklan atau pembelian dalam aplikasi.",0,"Benar. Iklan dan in-app purchase adalah model pendapatan umum pada gim."],["Usaha perangkat lunak tidak memerlukan analisis kebutuhan pasar.",1,"Salah. Tanpa analisis pasar, produk berisiko tidak dibutuhkan pengguna."]]},
{e:1,s:"Manajemen Proyek dan Budaya Mutu",t:"mc",q:"Pada model Waterfall, tahap yang dilakukan tepat setelah analisis kebutuhan adalah…",o:["Desain sistem","Pengujian","Pemeliharaan","Implementasi (coding)"],a:0,x:["Tepat. Urutan Waterfall: analisis, desain, implementasi, pengujian, lalu pemeliharaan.","Pengujian dilakukan setelah implementasi, bukan langsung setelah analisis.","Pemeliharaan adalah tahap terakhir setelah produk digunakan.","Implementasi baru dimulai setelah desain selesai, sehingga bukan tahap berikutnya."]},
{e:1,s:"Manajemen Proyek dan Budaya Mutu",t:"cb",q:"Pilih SEMUA karakteristik pendekatan Agile:",o:["Pengembangan iteratif dalam sprint pendek","Kolaborasi berkelanjutan dengan klien","Seluruh persyaratan dikunci sejak awal dan tidak boleh berubah","Terbuka terhadap perubahan kebutuhan","Dokumentasi dan pengujian tidak diperlukan"],a:[0,1,3],x:["Benar. Agile bekerja dalam iterasi (sprint) agar hasil dapat dievaluasi sering.","Benar. Klien dilibatkan terus-menerus untuk memberi umpan balik.","Salah. Penguncian persyaratan sejak awal adalah ciri pendekatan berurutan seperti Waterfall.","Benar. Perubahan kebutuhan dianggap wajar dan diakomodasi pada sprint berikutnya.","Salah. Agile tetap menuntut pengujian dan dokumentasi yang secukupnya."]},
{e:1,s:"Manajemen Proyek dan Budaya Mutu",t:"mc",q:"Tim menemukan bug yang berulang pada modul login. Tindakan yang sesuai budaya mutu adalah…",o:["Menambalnya setiap kali muncul tanpa mencatat","Menganalisis akar masalah, memperbaiki, lalu menambah pengujian agar tidak terulang","Menyalahkan programmer yang menulis modul tersebut","Menghapus fitur login dari produk"],a:1,x:["Kurang tepat. Tambalan tanpa pencatatan tidak mencegah bug yang sama kembali.","Tepat. Budaya mutu menekankan perbaikan akar masalah dan pencegahan, misalnya lewat pengujian otomatis.","Kurang tepat. Menyalahkan individu tidak memperbaiki proses; mutu adalah tanggung jawab tim.","Kurang tepat. Menghapus fitur menghilangkan kebutuhan pengguna, bukan menyelesaikan masalah."]},
{e:2,s:"K3LH dan Budaya Kerja Profesional",t:"mc",q:"Alat pemadam yang tepat untuk kebakaran akibat korsleting listrik di ruang server adalah…",o:["APAR jenis CO2 (karbon dioksida)","Menyiram dengan air dari selang","Menyiram dengan air sabun","Menutup dengan karpet basah"],a:0,x:["Tepat. CO2 tidak menghantarkan listrik dan tidak meninggalkan residu pada perangkat elektronik.","Berbahaya. Air menghantarkan listrik sehingga berisiko sengatan dan merusak perangkat.","Berbahaya. Air sabun tetap mengandung air yang menghantarkan listrik.","Kurang tepat. Karpet basah tetap membawa air dan tidak aman bagi sumber listrik yang aktif."]},
{e:2,s:"K3LH dan Budaya Kerja Profesional",t:"tb",q:"Tentukan Benar atau Salah terkait budaya kerja dan etika profesional:",c:["Benar","Salah"],r:[["Datang tepat waktu dan menyelesaikan tugas sesuai kesepakatan mencerminkan budaya kerja profesional.",0,"Benar. Disiplin dan tanggung jawab adalah inti profesionalisme."],["Membagikan data pelanggan ke teman tanpa izin boleh jika tidak merugikan.",1,"Salah. Data pelanggan bersifat rahasia; membagikannya tanpa izin melanggar etika dan hukum perlindungan data."],["Tidak memakai perangkat lunak bajakan adalah bagian dari etika profesi.",0,"Benar. Menghargai hak cipta dan lisensi adalah kewajiban profesional."],["Berkomunikasi kasar dengan rekan kerja boleh asalkan tugas selesai.",1,"Salah. Komunikasi yang santun dan saling menghargai tetap menjadi tuntutan budaya kerja."]]},
{e:2,s:"K3LH dan Budaya Kerja Profesional",t:"cb",q:"Pilih SEMUA tindakan pengelolaan lingkungan kerja yang tepat:",o:["Menyerahkan baterai dan komponen bekas ke tempat daur ulang limbah elektronik","Membuang baterai bekas ke tempat sampah biasa","Mematikan perangkat yang tidak dipakai untuk menghemat energi","Membakar kabel bekas untuk mengambil tembaganya","Mengurangi pencetakan dengan memakai dokumen digital"],a:[0,2,4],x:["Benar. Limbah elektronik mengandung bahan berbahaya sehingga harus didaur ulang khusus.","Salah. Baterai mencemari tanah dan air jika dibuang sembarangan.","Benar. Mematikan perangkat yang tidak dipakai menghemat listrik.","Salah. Pembakaran kabel melepaskan zat beracun yang berbahaya bagi kesehatan dan lingkungan.","Benar. Dokumen digital mengurangi penggunaan kertas dan limbah."]},
{e:2,s:"Pengelolaan Aset Fisik dan Digital",t:"mc",q:"Tim mengerjakan proyek gim bersama. Cara terbaik menghindari file saling menimpa adalah…",o:["Mengirim file zip bergantian lewat chat","Memakai repositori Git dengan branch dan merge","Hanya satu orang yang boleh mengedit seluruh proyek","Menyimpan salinan di flashdisk masing-masing"],a:1,x:["Kurang tepat. Cara ini rawan versi ganda dan file tertimpa tanpa jejak perubahan.","Tepat. Git mencatat riwayat, mendukung kerja paralel lewat branch, dan membantu menyatukan perubahan.","Kurang tepat. Cara ini menghambat kolaborasi dan membuat satu orang menjadi titik kegagalan.","Kurang tepat. Salinan terpisah menyebabkan versi tidak sinkron dan sulit digabungkan."]},
{e:2,s:"Pengelolaan Aset Fisik dan Digital",t:"tb",q:"Tentukan Benar atau Salah terkait pengelolaan aset kerja:",c:["Benar","Salah"],r:[["Laptop dan perangkat kerja perlu didata dan dirawat secara berkala.",0,"Benar. Pendataan dan perawatan menjaga umur dan kinerja aset fisik."],["Lisensi dan akun layanan tidak perlu didokumentasikan.",1,"Salah. Aset digital seperti lisensi perlu dicatat agar tidak kedaluwarsa atau hilang."],["Kata sandi sebaiknya dibagikan lewat chat grup agar mudah diakses.",1,"Salah. Kata sandi di chat grup mudah bocor; gunakan pengelola kata sandi atau mekanisme akses yang aman."],["Pengaturan hak akses membatasi siapa yang boleh mengubah file proyek.",0,"Benar. Hak akses mencegah perubahan atau penghapusan oleh pihak yang tidak berwenang."]]},
{e:2,s:"Pengelolaan Aset Fisik dan Digital",t:"cb",q:"Pilih SEMUA praktik pengelolaan dokumentasi dan database proyek yang tepat:",o:["Menyimpan dokumentasi bersama kode di repositori","Melakukan backup database secara terjadwal","Menamai file dengan konvensi yang konsisten dan memakai nomor versi","Menyimpan password database langsung di dalam source code","Menghapus riwayat versi lama tanpa backup demi menghemat ruang"],a:[0,1,2],x:["Benar. Dokumentasi yang dekat dengan kode lebih mudah diperbarui dan ditemukan.","Benar. Backup terjadwal melindungi data dari kerusakan dan kesalahan manusia.","Benar. Konvensi dan versi membantu melacak perubahan serta menghindari kebingungan.","Salah. Password di source code terbaca siapa pun yang memegang kode; simpan di konfigurasi terpisah.","Salah. Tanpa backup, riwayat yang hilang tidak dapat dikembalikan saat terjadi masalah."]},
{e:3,s:"Lingkungan Sistem Operasi",t:"mc",q:"Perintah Linux untuk menampilkan direktori kerja saat ini adalah…",o:["pwd","cd","ls","cat"],a:0,x:["Tepat. pwd (print working directory) menampilkan lokasi direktori aktif.","cd dipakai untuk berpindah direktori.","ls menampilkan isi direktori, bukan lokasinya.","cat menampilkan isi file."]},
{e:3,s:"Infrastruktur dan Perangkat Jaringan",t:"mc",q:"Alamat IP 192.168.10.5/24 memiliki alamat network…",o:["192.168.10.0","192.168.0.0","192.168.10.255","192.168.10.5"],a:0,x:["Tepat. /24 berarti mask 255.255.255.0; oktet host diubah menjadi 0 sehingga network address 192.168.10.0.","Kurang tepat. Ini akan benar untuk mask /16, bukan /24.","Kurang tepat. Itu adalah alamat broadcast (oktet host semua bernilai 1).","Kurang tepat. Itu alamat host, bukan alamat network."]},
{e:3,s:"Arsitektur dan Mekanisme TCP/IP",t:"tb",q:"Tentukan Benar atau Salah terkait protokol TCP/IP:",c:["Benar","Salah"],r:[["TCP bersifat connection-oriented dan memakai three-way handshake.",0,"Benar. TCP membangun koneksi dengan SYN, SYN-ACK, dan ACK sebelum mengirim data."],["UDP menjamin semua paket tiba secara berurutan.",1,"Salah. UDP tidak menjamin pengiriman maupun urutan; ia lebih cepat tetapi tanpa jaminan."],["Port 80 umumnya dipakai HTTP dan port 443 dipakai HTTPS.",0,"Benar. Itu port standar untuk layanan web."],["DNS bekerja pada layer Network Access.",1,"Salah. DNS adalah protokol layer Application."]]},
{e:3,s:"Infrastruktur dan Perangkat Jaringan",t:"cb",q:"Pilih SEMUA perangkat atau media yang dipakai membangun jaringan lokal:",o:["Switch","Kabel UTP","Access Point","Monitor","Router"],a:[0,1,2,4],x:["Benar. Switch menghubungkan perangkat dalam satu jaringan.","Benar. Kabel UTP adalah media transmisi umum pada jaringan kabel.","Benar. Access point menyediakan konektivitas nirkabel.","Salah. Monitor adalah perangkat keluaran, bukan perangkat jaringan.","Benar. Router menghubungkan jaringan lokal ke jaringan lain seperti internet."]},
{e:4,s:"Struktur Data dan Tipe Data",t:"mc",q:"Tipe data paling tepat untuk menyimpan harga berpecahan seperti 15750.50 adalah…",o:["float atau double","integer","boolean","char"],a:0,x:["Tepat. Tipe bilangan pecahan (floating point) menyimpan nilai desimal.","Kurang tepat. Integer hanya menyimpan bilangan bulat sehingga bagian desimal hilang.","Kurang tepat. Boolean hanya bernilai benar atau salah.","Kurang tepat. Char menyimpan satu karakter."]},
{e:4,s:"Struktur Data dan Tipe Data",t:"cb",q:"Pilih SEMUA pernyataan yang benar tentang array:",o:["Elemen diakses melalui indeks","Pada banyak bahasa pemrograman, indeks dimulai dari 0","Array hanya dapat menyimpan satu elemen","Array berisi 5 elemen memiliki indeks terakhir 4","Ukuran array selalu bertambah otomatis pada semua bahasa"],a:[0,1,3],x:["Benar. Indeks adalah penunjuk posisi elemen.","Benar. Indeks umumnya dimulai dari 0, misalnya pada Java, C, dan Python.","Salah. Array dibuat untuk menyimpan banyak elemen.","Benar. Indeks 0 sampai 4 menghasilkan 5 elemen.","Salah. Pada banyak bahasa ukuran array tetap; yang dinamis adalah struktur seperti list atau ArrayList."]},
{e:4,s:"Struktur Kontrol Program",t:"mc",code:"x = 7\nif x > 10:\n    print(A)\nelse if x > 5:\n    print(B)\nelse:\n    print(C)",q:"Apa keluaran potongan program berikut?",o:["A","B","C","B dan C"],a:1,x:["Kurang tepat. Kondisi x > 10 salah karena 7 tidak lebih dari 10.","Tepat. Kondisi pertama salah, kondisi kedua x > 5 benar sehingga B dicetak dan cabang lain dilewati.","Kurang tepat. Cabang else hanya jalan bila semua kondisi sebelumnya salah, sedangkan x > 5 benar.","Kurang tepat. Pada rangkaian if-else if, hanya satu cabang yang dijalankan."]},
{e:4,s:"Struktur Kontrol Program",t:"tb",q:"Tentukan Benar atau Salah terkait struktur kontrol:",c:["Benar","Salah"],r:[["Perulangan for cocok dipakai bila jumlah pengulangan sudah diketahui.",0,"Benar. For menggabungkan inisialisasi, kondisi, dan perubahan counter dalam satu baris."],["Perulangan while selalu dijalankan minimal satu kali sebelum kondisi diperiksa.",1,"Salah. While memeriksa kondisi lebih dulu sehingga bisa tidak berjalan sama sekali; do-while yang berjalan minimal sekali."],["Perintah break menghentikan perulangan lebih awal.",0,"Benar. Break keluar dari perulangan saat dijalankan."],["Percabangan if bersarang yang terlalu dalam membuat alur lebih mudah dibaca.",1,"Salah. Nesting terlalu dalam menyulitkan pembacaan; sederhanakan dengan kondisi gabungan atau fungsi."]]},
{e:4,s:"Modularisasi Program",t:"mc",q:"Sebuah fungsi 300 baris mengurus input, fisika, dan menggambar gim. Perbaikan terbaik adalah…",o:["Memecahnya menjadi fungsi-fungsi kecil dengan satu tugas masing-masing","Menambah komentar saja","Menyalin fungsi ke file lain","Menghapus fungsi tersebut"],a:0,x:["Tepat. Fungsi berfokus tunggal lebih mudah dibaca, diuji, dan dipakai ulang.","Kurang tepat. Komentar membantu, tetapi struktur yang terlalu besar tetap sulit dirawat.","Kurang tepat. Menyalin hanya menggandakan masalah dan duplikasi.","Kurang tepat. Fungsionalitasnya masih dibutuhkan."]},
{e:5,s:"Konsep Dasar dan Prinsip OOP",t:"mc",q:"Pernyataan yang paling tepat tentang class dan object adalah…",o:["Class adalah cetak biru, object adalah wujud (instans) dari class tersebut","Object adalah cetak biru dari class","Class dan object adalah hal yang sama","Class hanya berisi data dan tidak boleh memiliki method"],a:0,x:["Tepat. Dari satu class dapat dibuat banyak object dengan nilai atribut masing-masing.","Kurang tepat. Hubungannya terbalik.","Kurang tepat. Class adalah definisi, sedangkan object adalah hasil instansiasinya.","Kurang tepat. Class berisi atribut dan method."]},
{e:5,s:"Konsep Dasar dan Prinsip OOP",t:"cb",q:"Pilih SEMUA yang merupakan anggota (member) sebuah class:",o:["Atribut","Method","Sistem operasi","Konstruktor","Monitor"],a:[0,1,3],x:["Benar. Atribut menyimpan keadaan object.","Benar. Method mendefinisikan perilaku object.","Salah. Sistem operasi bukan bagian dari class.","Benar. Konstruktor dipakai untuk menginisialisasi object saat dibuat.","Salah. Monitor adalah perangkat keras."]},
